name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The app reports the Cargo version: it must match the tag.
      - name: Tag matches the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - name: Build (Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p pitstop-cli --target ${{ matrix.target }}
          cd crates/pitstop-app
          npx --yes @tauri-apps/cli@^2 build --bundles nsis --target ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          mkdir dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$dir"/bundle/nsis/*-setup.exe "dist/MCSwitch-windows-${{ matrix.arch }}-setup.exe"
            name="MCSwitch-windows-${{ matrix.arch }}-portable"
            mkdir "$name"
            cp "$dir/pitstop-app.exe" "$name/MC Switch.exe"
            cp "$dir/mc-switch.exe" README.md LICENSE "$name/"
            7z a "dist/$name.zip" "$name" >/dev/null
          else
            sh crates/pitstop-app/macos/bundle.sh "$dir/pitstop-app"
            mkdir dmg
            cp -R "$dir/MC Switch.app" dmg/
            ln -s /Applications dmg/Applications
            hdiutil create -volname "MC Switch" -srcfolder dmg -ov -format UDZO \
              "dist/MCSwitch-macos-${{ matrix.arch }}.dmg"
            name="mc-switch-cli-macos-${{ matrix.arch }}"
            mkdir "$name"
            cp "$dir/mc-switch" README.md LICENSE "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          for f in *; do
            $sum "$f" > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'

          ## Download

          | System | File |
          |---|---|
          | Windows 10/11 (64-bit) | `MCSwitch-windows-x64-setup.exe` (installer) or `MCSwitch-windows-x64-portable.zip` |
          | macOS 11+, Apple Silicon | `MCSwitch-macos-arm64.dmg` |
          | macOS 11+, Intel | `MCSwitch-macos-x64.dmg` |

          The app is not code-signed yet. Windows: **More info → Run anyway**. macOS: open the app, click **Done** (not Move to Trash), then **System Settings → Privacy & Security → Open Anyway**. If it says the app "is damaged" or there is no Open Anyway button, run `xattr -dr com.apple.quarantine "/Applications/MC Switch.app"` in Terminal.
          Each download has a `.sha256` checksum next to it.
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: MC Switch ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
